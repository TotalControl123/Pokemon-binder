<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<meta name="theme-color" content="#111420">
<meta name="description" content="__DESC__">
<meta property="og:type" content="website">
<meta property="og:title" content="__TITLE__">
<meta property="og:description" content="__DESC__">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111420; --slab:#171b29; --pocket:#1d2231; --edge:#2b3247;
  --paper:#e9eaf2; --mute:#79809a; --dim:#4b5370;
  --foil-a:#67e8f9; --foil-b:#a78bfa; --foil-c:#fcd34d;
  --pad:clamp(16px,4vw,40px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ink); color:var(--paper);
  font:400 15px/1.5 Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:var(--pad)}

/* ---- header ---- */
header{padding-bottom:28px;border-bottom:1px solid var(--edge);margin-bottom:28px}
.eyebrow{
  font:700 11px/1 "JetBrains Mono",monospace;letter-spacing:.22em;
  text-transform:uppercase;color:var(--mute);margin-bottom:14px;
}
h1{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
  font-size:clamp(34px,7vw,60px);line-height:.95;letter-spacing:-.03em;margin:0 0 6px;
}
h1 em{
  font-style:normal;
  background:linear-gradient(100deg,var(--foil-a),var(--foil-b) 45%,var(--foil-c));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{color:var(--mute);font-size:14px;margin:0}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}
.seg{display:flex;background:var(--slab);border:1px solid var(--edge);border-radius:9px;padding:3px}
.seg button{
  appearance:none;border:0;background:none;color:var(--mute);cursor:pointer;
  font:600 12px/1 Inter,sans-serif;padding:8px 13px;border-radius:6px;
}
.seg button[aria-pressed=true]{background:var(--edge);color:var(--paper)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
input[type=search]{
  flex:1;min-width:170px;background:var(--slab);border:1px solid var(--edge);
  color:var(--paper);border-radius:9px;padding:10px 13px;font:400 14px Inter,sans-serif;
}
input[type=search]::placeholder{color:var(--dim)}
label.chk{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:13px;cursor:pointer;user-select:none}
input[type=checkbox]{accent-color:var(--foil-b);width:15px;height:15px}
:is(button,input,summary):focus-visible{outline:2px solid var(--foil-a);outline-offset:2px}

/* ---- set rows ---- */
details.set{border-bottom:1px solid var(--edge)}
details.set > summary{
  list-style:none;cursor:pointer;display:grid;gap:4px 16px;padding:18px 4px;
  grid-template-columns:1fr auto;align-items:center;
}
summary::-webkit-details-marker{display:none}
.set-name{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:19px;letter-spacing:-.01em}
.set-meta{font:400 12px "JetBrains Mono",monospace;color:var(--dim)}
.tally{font:700 14px "JetBrains Mono",monospace;text-align:right;white-space:nowrap}
.tally small{display:block;font-weight:400;font-size:11px;color:var(--dim);margin-top:3px}
.bar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--pocket);overflow:hidden}
.bar i{
  display:block;height:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--foil-a),var(--foil-b) 55%,var(--foil-c));
  transition:width .5s cubic-bezier(.2,.8,.2,1);
}
details.set[open] > summary .set-name{color:#fff}

/* ---- pockets ---- */
.page{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));
  gap:10px;padding:6px 0 30px;
  content-visibility:auto;contain-intrinsic-size:auto 600px;
}
.pocket{
  position:relative;aspect-ratio:63/88;border-radius:7px;background:var(--pocket);
  border:1px solid var(--edge);overflow:hidden;display:flex;flex-direction:column;
  justify-content:flex-end;padding:7px;
}
.pocket img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .4s;
}
.pocket.have img.on{opacity:1}
.pocket.have{background:#232a3d}
/* Held has to read as held when no art loads - with art off, offline, or
   before the image arrives, this dot is the only signal. Once the art is
   showing it says nothing the image doesn't, so it fades out. */
.pocket.have::before{
  content:'';position:absolute;top:6px;right:6px;z-index:3;width:9px;height:9px;
  border-radius:50%;background:var(--foil-a);
  box-shadow:0 0 0 2px rgba(10,12,20,.65);
  transition:opacity .35s ease;
}
.pocket.have.art::before{opacity:0}
.pocket.miss img.on{opacity:.17;filter:grayscale(.85) contrast(.85)}
.pocket.miss{border-style:dashed;border-color:#333a52}
.cap{
  position:relative;z-index:2;font:400 10px/1.25 Inter,sans-serif;color:var(--mute);
  word-break:break-word;
  background:linear-gradient(transparent,rgba(10,12,20,.92) 42%);
  margin:-7px;padding:22px 7px 7px;
}
.pocket.have .cap{color:var(--paper)}
.num{font:700 10px "JetBrains Mono",monospace;color:var(--dim);display:block}
.price{
  display:block;margin-top:3px;
  font:700 10px "JetBrains Mono",monospace;color:var(--foil-c);
}
.pocket.miss .price{color:#8d7a4e}
.cost{color:var(--foil-c)}
.pocket.have .num{color:var(--foil-a)}
/* ---- paired base / reverse ---- */
/* Strict numerical order: no dense packing, or a later single backfills an
   earlier gap and the numbers stop reading in sequence. An even column count
   keeps pairs from straddling row ends. */
.page.paired{
  grid-auto-flow:row;
  grid-template-columns:repeat(8,1fr);
}
@media (max-width:980px){.page.paired{grid-template-columns:repeat(6,1fr)}}
@media (max-width:720px){.page.paired{grid-template-columns:repeat(4,1fr)}}
@media (max-width:460px){.page.paired{grid-template-columns:repeat(2,1fr)}}
.pair{display:grid;grid-column:span 2;grid-template-columns:1fr 1fr;gap:6px}
@media (max-width:420px){
  .pair{grid-column:span 2}
}
/* Reverse holos reuse the base art, so a foil sheen is what tells them apart. */
.pocket.rev::after{
  content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    repeating-linear-gradient(112deg,
      rgba(255,255,255,.13) 0 2px, rgba(255,255,255,0) 2px 6px),
    linear-gradient(112deg,
      rgba(103,232,249,.62) 0%, rgba(167,139,250,.16) 20%,
      rgba(252,211,77,.55) 38%, rgba(103,232,249,.14) 56%,
      rgba(244,114,182,.55) 74%, rgba(167,139,250,.26) 100%);
  mix-blend-mode:overlay;opacity:.9;
  transition:filter .45s ease, opacity .45s ease;
}
.pocket.rev.miss::after{opacity:.32}
.pocket.rev:hover::after{filter:hue-rotate(50deg) saturate(1.3)}
.rev-tag{
  position:absolute;top:6px;left:6px;z-index:3;
  font:700 8px "JetBrains Mono",monospace;letter-spacing:.1em;color:#0d1018;
  background:linear-gradient(100deg,var(--foil-a),var(--foil-b) 60%,var(--foil-c));
  border-radius:4px;padding:2px 5px;
}

/* ---- binder view ---- */
.bctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.bctl select{
  background:var(--slab);border:1px solid var(--edge);color:var(--paper);
  border-radius:9px;padding:9px 11px;font:500 13px Inter,sans-serif;max-width:100%;
}
.spread{display:flex;justify-content:center;align-items:stretch;gap:0}
.bpage{
  background:linear-gradient(160deg,#1b2030,#151926);
  border:1px solid var(--edge);padding:clamp(10px,2vw,18px);
  display:grid;gap:clamp(6px,1.4vw,12px);flex:1;min-width:0;
  align-content:start;
}
.bpage.p3{grid-template-columns:repeat(3,1fr)}
.bpage.p2{grid-template-columns:repeat(2,1fr)}
.bpage:first-child{border-radius:10px 0 0 10px}
.bpage:last-child{border-radius:0 10px 10px 0}
.bpage.solo{border-radius:10px}
.rings{
  width:22px;flex:none;background:#0e111a;border-top:1px solid var(--edge);
  border-bottom:1px solid var(--edge);display:flex;flex-direction:column;
  align-items:center;justify-content:space-around;padding:26px 0;
}
.rings i{
  width:9px;height:9px;border-radius:50%;background:#080a11;
  box-shadow:inset 0 1px 2px #000,0 0 0 1px #2a3145;
}
.slot-empty{
  aspect-ratio:63/88;border-radius:7px;border:1px dashed #262d42;
  background:rgba(0,0,0,.15);
}
.bnav{display:flex;align-items:center;gap:14px;justify-content:center;margin:20px 0 4px}
.bnav button{
  appearance:none;background:var(--slab);border:1px solid var(--edge);
  color:var(--paper);border-radius:9px;padding:9px 15px;cursor:pointer;
  font:600 13px Inter,sans-serif;
}
.bnav button:disabled{opacity:.3;cursor:not-allowed}
.bnav .pageno{font:400 12px "JetBrains Mono",monospace;color:var(--mute);min-width:110px;text-align:center}
.bempty{padding:50px 10px;text-align:center;color:var(--dim)}

/* ---- sealed / untracked inventory ---- */
.shelf{padding:6px 0 26px;display:flex;flex-direction:column;gap:2px}
.item{
  display:flex;align-items:center;gap:12px;padding:11px 8px;
  border-bottom:1px solid #1e2434;
}
.item:last-child{border-bottom:0}
.item-logo{width:46px;height:26px;object-fit:contain;flex:none;opacity:.85}
.item-logo.card{
  width:26px;height:36px;object-fit:cover;border-radius:3px;opacity:1;
}
.item-logo.blank{
  background:var(--pocket);border-radius:4px;border:1px solid var(--edge);
  display:flex;align-items:center;justify-content:center;
  font:700 8px "JetBrains Mono",monospace;letter-spacing:.08em;color:var(--dim);
}
.item-found{color:var(--foil-a)}
.item-main{flex:1;min-width:0}
.item-name{font-size:13px;color:var(--paper)}
.item-set{font:400 11px "JetBrains Mono",monospace;color:var(--dim);margin-top:2px}
.item-qty{
  font:700 11px "JetBrains Mono",monospace;color:var(--mute);flex:none;
}
.item-price{
  font:700 12px "JetBrains Mono",monospace;color:var(--foil-c);flex:none;
  min-width:72px;text-align:right;
}
details.set.inv > summary .set-name{color:var(--foil-c)}

/* ---- variant tracks ---- */
.track{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px;padding:14px 2px 10px;
}
.track-name{
  font:600 12px/1 Inter,sans-serif;letter-spacing:.02em;color:var(--paper);
}
.track-name.rev{color:var(--foil-b)}
.track-count{font:400 11px "JetBrains Mono",monospace;color:var(--dim)}
.track-bar{flex:1;height:3px;border-radius:2px;background:var(--pocket);overflow:hidden;min-width:40px}
.track-bar i{display:block;height:100%;background:currentColor;opacity:.8}
.rev-tint{border-color:#3a2f55}
.note{
  padding:0 2px 8px;font:400 11px Inter,sans-serif;color:var(--dim);
}
.note b{color:var(--foil-b);font-weight:600}
.offline{
  border:1px solid #4a3a2a;background:#241d16;border-radius:10px;
  padding:12px 14px;margin-bottom:22px;font-size:13px;color:#e2c9a4;
}
.strays{padding:0 0 26px;font-size:13px;color:var(--mute)}
.strays code{font-family:"JetBrains Mono",monospace;color:var(--foil-a)}
.empty{padding:26px 4px;color:var(--dim);font-size:14px}
footer{margin-top:36px;padding-top:20px;border-top:1px solid var(--edge);color:var(--dim);font-size:12px}
footer a{color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow" id="eyebrow">Collection checklist</p>
    <h1>What's <em>missing</em></h1>
    <p class="sub" id="sub"></p>
    <div class="controls">
      <div class="seg" role="group" aria-label="Completion mode">
        <button id="m-num" aria-pressed="true">By number</button>
        <button id="m-mas" aria-pressed="false">Split by finish</button>
        <button id="m-bin" aria-pressed="false">Binder</button>
      </div>
      <input type="search" id="q" placeholder="Find a card or set">
      <label class="chk"><input type="checkbox" id="only"> Missing only</label>
      <label class="chk"><input type="checkbox" id="art" checked> Card art</label>
      <label class="chk" id="price-wrap"><input type="checkbox" id="price"> Prices</label>
      <label class="chk" id="jp-wrap"><input type="checkbox" id="jp" checked> Japanese sets</label>
    </div>
  </header>
  <main id="out"></main>
  <footer>
    Checklists and card images from <a href="https://tcgdex.dev">TCGdex</a>.
    <span id="price-note"></span>
  </footer>
</div>

<script>
const DATA = /*__DATA__*/null;
const out = document.getElementById('out');
let mode = 'num', onlyMissing = false, query = '', showArt = true, showPrice = false,
    showJP = true;

// Sets currently in scope. Japanese printings can be hidden - they're a
// different collecting goal and TCGdex carries no prices for most of them.
const visibleSets = () =>
  showJP ? DATA.sets : DATA.sets.filter(s => !String(s.tcgdex).startsWith('ja/'));
const opened = new Set();   // sets the reader has expanded, kept across redraws
const START_SPLIT = true;   // open on the paired base/reverse view

// A "track" is one parallel checklist through a set. Base print folds normal
// and holo together (a set is one list of numbers, some of which print holo);
// reverse holo is its own run of the same numbers.
const TRACKS = [
  {key:'base', name:'Base print',  cls:'',    vars:['normal','holo']},
  {key:'rev',  name:'Reverse holo',cls:'rev', vars:['reverse']},
  {key:'fe',   name:'1st Edition', cls:'',    vars:['firstEdition']},
];

// Cards with no variant data at all still belong somewhere: put them in the
// base print track so they never silently disappear from split mode.
const bare = c => !c.vars.length;
const inTrack = (c,t) =>
  t.vars.some(v => c.vars.includes(v)) || (t.key === 'base' && bare(c));
const heldIn = (c,t) =>
  t.vars.some(v => c.has[v] > 0) || (t.key === 'base' && bare(c) && c.qty > 0);

function tracksFor(set){
  return TRACKS
    .map(t => ({...t, cards:set.cards.filter(c => inTrack(c,t))}))
    .filter(t => t.cards.length);
}

if (!DATA.variantData) {
  const b = document.getElementById('m-mas');
  b.disabled = true;
  b.title = 'Rebuild without --no-variants to enable master-set mode';
}
document.getElementById('sub').textContent = DATA.owner
  ? DATA.owner + " \u2014 " + DATA.sets.length + " sets tracked"
  : DATA.sets.length + " sets tracked";

// Cardmarket prices the plain and foil printings separately; fall back to
// whichever exists so a card with only one listed still shows something.
function priceOf(c, reverse){
  if (!c.p) return 0;
  const [plain, foil] = c.p;
  return (reverse ? (foil || plain) : (plain || foil)) || 0;
}

function money(set){
  // Track how many of the missing cards actually carry a price: a set with no
  // pricing at all sums to zero, which must not be read as "nothing to buy".
  let held = 0, need = 0, missing = 0, priced = 0;
  const add = (c, rev, has) => {
    const v = priceOf(c, rev);
    if (has) { held += v; return; }
    missing++;
    if (v) { need += v; priced++; }
  };
  if (mode === 'mas') {
    const tracks = tracksFor(set);
    if (tracks.length) {
      for (const t of tracks)
        for (const c of t.cards) add(c, t.key === 'rev', heldIn(c, t));
      return {held, need, missing, priced};
    }
  }
  for (const c of set.cards) add(c, false, c.qty > 0);
  return {held, need, missing, priced};
}

function costLabel(set){
  const m = money(set);
  if (!m.missing) return 'complete';
  if (!m.priced) return 'no price data';
  return (m.priced < m.missing ? 'from ' : '') + fmt(m.need) + ' to complete';
}

const fmt = v => DATA.symbol + (v >= 100
  ? Math.round(v).toLocaleString()
  : v.toFixed(2));

function tally(set){
  let have = 0, total = 0;
  if (mode === 'num') {
    for (const c of set.cards) { total++; if (c.qty > 0) have++; }
  } else {
    for (const t of tracksFor(set))
      for (const c of t.cards) { total++; if (heldIn(c,t)) have++; }
    if (!total) for (const c of set.cards) { total++; if (c.qty > 0) have++; }
  }
  return {have, total, pct: total ? have/total : 0};
}

function matches(c){
  if (!query) return true;
  return (c.name||'').toLowerCase().includes(query) || String(c.n).includes(query);
}

function pocket(c, held, reverse){
  const el = document.createElement('div');
  el.className = 'pocket ' + (held ? 'have' : 'miss') + (reverse ? ' rev' : '');
  if (c.img && showArt) {
    const img = new Image();
    img.loading = 'lazy'; img.decoding = 'async'; img.alt = '';
    img.referrerPolicy = 'no-referrer';
    img.src = c.img + '/low.webp';
    img.onload  = () => { img.classList.add('on'); el.classList.add('art'); };
    img.onerror = () => noteOffline();
    el.append(img);
  }
  if (reverse) {
    const tag = document.createElement('span');
    tag.className = 'rev-tag'; tag.textContent = 'REV';
    el.append(tag);
  }
  const cap = document.createElement('div');
  cap.className = 'cap';
  cap.innerHTML = '<span class="num"></span>';
  cap.firstChild.textContent = c.n;
  cap.append(document.createTextNode(c.name || ''));
  if (showPrice && c.p) {
    const pr = priceOf(c, reverse);
    if (pr) {
      const sp = document.createElement('span');
      sp.className = 'price';
      sp.textContent = fmt(pr);
      cap.append(sp);
    }
  }
  el.append(cap);
  return el;
}

// Flat grid: one pocket per card, used for the plain by-number view.
function grid(cards, heldFn){
  const page = document.createElement('div');
  page.className = 'page';
  let n = 0;
  for (const c of cards) {
    if (!matches(c)) continue;
    const held = heldFn(c);
    if (onlyMissing && held) continue;
    page.append(pocket(c, held, false)); n++;
  }
  return n ? page : null;
}

// Paired grid: base print on the left, its reverse holo directly beside it.
function pairedGrid(set, base, rev){
  const page = document.createElement('div');
  page.className = 'page paired';
  let n = 0;
  for (const c of set.cards) {
    if (!matches(c)) continue;
    const inB = inTrack(c, base), inR = inTrack(c, rev);
    if (!inB && !inR) continue;
    const hB = inB && heldIn(c, base), hR = inR && heldIn(c, rev);

    // On a want-list, show only what's actually missing: if the base print is
    // already held, the reverse alone is the ask.
    if (onlyMissing) {
      const needB = inB && !hB, needR = inR && !hR;
      if (!needB && !needR) continue;
      if (needB && needR) {
        const pair = document.createElement('div');
        pair.className = 'pair';
        pair.append(pocket(c, false, false), pocket(c, false, true));
        page.append(pair);
      } else {
        page.append(pocket(c, false, needR));
      }
      n++;
      continue;
    }

    if (inB && inR) {
      const pair = document.createElement('div');
      pair.className = 'pair';
      pair.append(pocket(c, hB, false));
      pair.append(pocket(c, hR, true));
      page.append(pair);
    } else {
      // ex cards and secrets have no reverse printing - single slot, no gap.
      page.append(pocket(c, inB ? hB : hR, !inB));
    }
    n++;
  }
  return n ? page : null;
}

// One inline progress chip per finish track, shown above the paired grid.
function band(t){
  const have = t.cards.filter(c => heldIn(c,t)).length;
  const d = document.createElement('span');
  d.style.cssText = 'display:flex;align-items:baseline;gap:8px;min-width:190px;flex:1';
  d.innerHTML =
    '<span class="track-name ' + t.cls + '"></span>' +
    '<span class="track-count">' + have + ' / ' + t.cards.length + '</span>' +
    '<span class="track-bar" style="color:' +
      (t.cls === 'rev' ? 'var(--foil-b)' : 'var(--foil-a)') + '">' +
      '<i style="width:' + (have/t.cards.length*100).toFixed(1) + '%"></i></span>';
  d.querySelector('.track-name').textContent = t.name;
  return d;
}

// Building every set's pockets up front is ~4,300 nodes and janks on phones.
// Summaries render immediately; a set's grid is built the first time it opens.
function buildBody(d, set){
  let drew = 0;
  if (mode === 'mas') {
    const tracks = tracksFor(set);
    const base = tracks.find(t => t.key === 'base');
    const rev  = tracks.find(t => t.key === 'rev');
    const row = document.createElement('div');
    row.className = 'track';
    for (const tr of tracks) row.append(band(tr));
    const g = rev && base ? pairedGrid(set, base, rev) : grid(set.cards, c => c.qty > 0);
    if (g) {
      d.append(row);
      if (set.revInferred) {
        const n = document.createElement('div');
        n.className = 'note';
        n.innerHTML = '<b>Reverse run reconstructed.</b> TCGdex has no reverse ' +
          'holo data for this set yet, so it is inferred from rarity: every ' +
          'Common, Uncommon and Rare inside the numbered run.';
        d.append(n);
      }
      d.append(g);
      drew++;
    }
  } else {
    const g = grid(set.cards, c => c.qty > 0);
    if (g) { d.append(g); drew++; }
  }
  if (!drew) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = onlyMissing ? 'Complete \u2014 nothing missing here.' : 'No cards match.';
    d.append(e);
  }
  if (set.strays.length) {
    const st = document.createElement('div');
    st.className = 'strays';
    st.append(document.createTextNode('Not on this checklist: '));
    set.strays.forEach((x,i) => {
      if (i) st.append(document.createTextNode(', '));
      const code = document.createElement('code');
      code.textContent = x.n;
      st.append(code, document.createTextNode(' ' + x.name));
    });
    d.append(st);
  }
}

// If the art can't be reached, say so once rather than leaving blank pockets.
let offlineShown = false, failures = 0;
function noteOffline(){
  if (offlineShown || ++failures < 4) return;
  offlineShown = true;
  const b = document.createElement('div');
  b.className = 'offline';
  b.textContent = "Card art couldn't load \u2014 you're offline, or the image host " +
    "is unreachable. Everything else works: cards you own have a dot in the corner, " +
    "missing ones don't.";
  out.parentNode.insertBefore(b, out);
}

// Sealed product and cards from sets with no checklist: inventory, not a
// checklist, so they get a plain list and sit out of the completion maths.
// Short tag for the placeholder tile when there's no image to show.
function kindOf(it){
  if (it.n) return String(it.n).split('/')[0];
  const n = it.name.toLowerCase();
  if (n.includes('elite trainer')) return 'ETB';
  if (n.includes('booster box')) return 'BOX';
  if (n.includes('booster bundle')) return 'BNDL';
  if (n.includes('booster')) return 'PACK';
  if (n.includes('tin')) return 'TIN';
  if (n.includes('collection')) return 'COLL';
  if (n.includes('deck')) return 'DECK';
  return 'SET';
}

function shelf(items){
  const el = document.createElement('div');
  el.className = 'shelf';
  let n = 0;
  for (const it of items) {
    if (query && !(it.name + ' ' + it.set).toLowerCase().includes(query)) continue;
    const row = document.createElement('div');
    row.className = 'item';
    // Orphan cards carry real card art (it.img); sealed product falls back to
    // the set logo (it.logo). Different shapes, so different classes.
    const art = it.img ? it.img + '/low.webp' : (it.logo ? it.logo + '.png' : null);
    if (art && showArt) {
      const img = new Image();
      img.className = it.img ? 'item-logo card' : 'item-logo';
      img.loading = 'lazy'; img.alt = '';
      img.referrerPolicy = 'no-referrer'; img.src = art;
      row.append(img);
    } else {
      // No art upstream for most sealed product and for sets TCGdex lacks.
      // A labelled tile beats an empty grey rectangle.
      const b = document.createElement('span');
      b.className = 'item-logo blank';
      b.textContent = kindOf(it);
      row.append(b);
    }
    const main = document.createElement('div');
    main.className = 'item-main';
    const nm = document.createElement('div');
    nm.className = 'item-name'; nm.textContent = it.name;
    const st = document.createElement('div');
    st.className = 'item-set';
    st.textContent = it.set + (it.n ? '  \u00b7  ' + it.n : '') +
                     (it.finish ? '  \u00b7  ' + it.finish : '');
    main.append(nm, st);
    if (it.found) {
      const f = document.createElement('div');
      f.className = 'item-set item-found';
      f.textContent = 'matched to ' + it.found;
      main.append(f);
    }
    row.append(main);
    if (it.qty > 1) {
      const q = document.createElement('span');
      q.className = 'item-qty'; q.textContent = '\u00d7' + it.qty;
      row.append(q);
    }
    if (showPrice && it.p) {
      const pr = document.createElement('span');
      pr.className = 'item-price';
      pr.textContent = fmt(it.p * it.qty);
      row.append(pr);
    }
    el.append(row); n++;
  }
  return n ? el : null;
}

function inventorySection(label, items, note){
  const body = shelf(items);
  if (!body) return null;
  const count = items.reduce((t,i) => t + i.qty, 0);
  const worth = items.reduce((t,i) => t + (i.p || 0) * i.qty, 0);
  const d = document.createElement('details');
  d.className = 'set inv';
  d.innerHTML =
    '<summary><div><div class="set-name"></div><div class="set-meta"></div></div>' +
    '<div class="tally">' + count + '<small>item' + (count === 1 ? '' : 's') +
    '</small></div></summary>';
  d.querySelector('.set-name').textContent = label;
  const meta = d.querySelector('.set-meta');
  meta.textContent = note;
  if (showPrice && worth) {
    meta.append(document.createTextNode('  \u00b7  '));
    const c = document.createElement('span');
    c.className = 'cost';
    c.textContent = fmt(worth) + ' held';
    meta.append(c);
  }
  d.addEventListener('toggle', () => {
    if (d.open) { opened.add(label); if (!d.dataset.built) { d.dataset.built='1'; d.append(shelf(items)); } }
    else opened.delete(label);
  });
  if (query || opened.has(label)) { d.open = true; d.dataset.built='1'; d.append(body); }
  return d;
}

// ---- binder view -------------------------------------------------------
// A set laid out as physical pages you flick through, rather than one long
// grid. Two facing pages on a wide screen, one on a phone.
const binder = { set: null, page: 0, size: 9, track: 'base' };

function binderSeq(set){
  const tracks = tracksFor(set);
  const base = tracks.find(t => t.key === 'base');
  const rev  = tracks.find(t => t.key === 'rev');
  const seq = [];
  for (const c of set.cards) {
    if (!matches(c)) continue;
    const inB = base && inTrack(c, base), inR = rev && inTrack(c, rev);
    if (binder.track !== 'rev' && inB) seq.push({c, rev:false, held:heldIn(c, base)});
    if (binder.track !== 'base' && inR) seq.push({c, rev:true,  held:heldIn(c, rev)});
    if (!base && !rev) seq.push({c, rev:false, held:c.qty > 0});
  }
  return onlyMissing ? seq.filter(x => !x.held) : seq;
}

function pagesPerView(){
  return window.matchMedia('(min-width: 900px)').matches ? 2 : 1;
}

function renderBinder(){
  out.textContent = '';
  const pool = visibleSets();
  if (!binder.set || !pool.some(s => s.label === binder.set)) {
    binder.set = pool[0] && pool[0].label;
  }
  const set = pool.find(s => s.label === binder.set);
  if (!set) { out.innerHTML = '<div class="bempty">No sets to show.</div>'; return; }

  const ctl = document.createElement('div');
  ctl.className = 'bctl';

  const sel = document.createElement('select');
  for (const s of pool) {
    const t = tally(s);
    const o = document.createElement('option');
    o.value = s.label;
    o.textContent = s.label + '  (' + t.have + '/' + t.total + ')';
    if (s.label === binder.set) o.selected = true;
    sel.append(o);
  }
  sel.onchange = () => { binder.set = sel.value; binder.page = 0; renderBinder(); };
  ctl.append(sel);

  const seg = (label, opts, cur, set_) => {
    const g = document.createElement('div');
    g.className = 'seg';
    g.setAttribute('aria-label', label);
    for (const [val, txt] of opts) {
      const b = document.createElement('button');
      b.textContent = txt;
      b.setAttribute('aria-pressed', String(val === cur));
      b.onclick = () => { set_(val); binder.page = 0; renderBinder(); };
      g.append(b);
    }
    return g;
  };
  ctl.append(seg('Page size', [[9,'3\u00d73'],[4,'2\u00d72']], binder.size,
                 v => binder.size = v));
  const hasRev = set.cards.some(c => c.vars.includes('reverse'));
  if (hasRev) {
    ctl.append(seg('Which cards', [['base','Base'],['rev','Reverse'],['both','Both']],
                   binder.track, v => binder.track = v));
  }
  out.append(ctl);

  const seq = binderSeq(set);
  if (!seq.length) {
    out.append(Object.assign(document.createElement('div'),
      {className:'bempty', textContent: onlyMissing
        ? 'Nothing missing in this set.' : 'No cards match.'}));
    return;
  }

  const per = pagesPerView();
  const total = Math.ceil(seq.length / binder.size);
  binder.page = Math.max(0, Math.min(binder.page, Math.max(0, total - per)));

  const spread = document.createElement('div');
  spread.className = 'spread';
  for (let i = 0; i < per; i++) {
    const idx = binder.page + i;
    if (idx >= total) break;
    if (i > 0) {
      // Ring spine between the two facing pages.
      const r = document.createElement('div');
      r.className = 'rings';
      for (let k = 0; k < 3; k++) r.append(document.createElement('i'));
      spread.append(r);
    }
    const page = document.createElement('div');
    page.className = 'bpage ' + (binder.size === 9 ? 'p3' : 'p2') + (per === 1 ? ' solo' : '');
    const slice = seq.slice(idx * binder.size, (idx + 1) * binder.size);
    for (const it of slice) page.append(pocket(it.c, it.held, it.rev));
    // Pad the final page so the grid keeps its shape.
    for (let k = slice.length; k < binder.size; k++) {
      page.append(Object.assign(document.createElement('div'), {className:'slot-empty'}));
    }
    spread.append(page);
  }
  out.append(spread);

  const nav = document.createElement('div');
  nav.className = 'bnav';
  const prev = document.createElement('button');
  prev.textContent = '\u2190 Back';
  prev.disabled = binder.page === 0;
  prev.onclick = () => { binder.page -= per; renderBinder(); };
  const next = document.createElement('button');
  next.textContent = 'Next \u2192';
  next.disabled = binder.page + per >= total;
  next.onclick = () => { binder.page += per; renderBinder(); };
  const no = document.createElement('span');
  no.className = 'pageno';
  no.textContent = per === 2 && binder.page + 1 < total
    ? 'Pages ' + (binder.page+1) + '\u2013' + (binder.page+2) + ' of ' + total
    : 'Page ' + (binder.page+1) + ' of ' + total;
  nav.append(prev, no, next);
  out.append(nav);

  const eb = document.getElementById('eyebrow');
  const held = seq.filter(x => x.held).length;
  eb.textContent = set.label + ' \u2014 ' + held + ' of ' + seq.length + ' in this binder';
}

document.addEventListener('keydown', e => {
  if (mode !== 'binder') return;
  if (e.target.matches('input,select,textarea')) return;
  if (e.key === 'ArrowLeft')  { binder.page = Math.max(0, binder.page - pagesPerView()); renderBinder(); }
  if (e.key === 'ArrowRight') { binder.page += pagesPerView(); renderBinder(); }
});
window.addEventListener('resize', () => { if (mode === 'binder') renderBinder(); });

function render(){
  if (mode === 'binder') return renderBinder();
  out.textContent = '';
  let shown = 0;
  for (const set of visibleSets()) {
    const hit = set.label.toLowerCase().includes(query);
    if (query && !hit && !set.cards.some(matches)) continue;
    shown++;
    const t = tally(set);

    const d = document.createElement('details');
    d.className = 'set';
    d.innerHTML =
      '<summary><div><div class="set-name"></div><div class="set-meta"></div></div>' +
      '<div class="tally">' + t.have + ' / ' + t.total +
      '<small>' + Math.round(t.pct*100) + '% complete</small></div>' +
      '<div class="bar"><i style="width:' + (t.pct*100).toFixed(1) + '%"></i></div></summary>';
    d.querySelector('.set-name').textContent = set.label;
    const meta = d.querySelector('.set-meta');
    meta.textContent = set.tcgdex + (set.released ? '  \u00b7  ' + set.released : '');
    if (showPrice && DATA.currency) {
      meta.append(document.createTextNode('  \u00b7  '));
      const c = document.createElement('span');
      c.className = 'cost';
      c.textContent = costLabel(set);
      meta.append(c);
    }

    d.addEventListener('toggle', () => {
      if (d.open) {
        opened.add(set.label);
        if (!d.dataset.built) { d.dataset.built = '1'; buildBody(d, set); }
      } else {
        opened.delete(set.label);
      }
    });
    // Restore-on-redraw builds directly: the toggle event is async, so relying
    // on it here leaves a re-opened set empty.
    if (query || opened.has(set.label)) {
      d.open = true;
      d.dataset.built = '1';
      buildBody(d, set);
    }
    out.append(d);
  }
  // Nothing here can be missing, so keep it out of the want-list view.
  if (!onlyMissing) {
    const extra = [
      inventorySection('Sealed', DATA.sealed || [],
        'boxes, ETBs and collections \u2014 no checklist to complete'),
      inventorySection('Outside a tracked set', DATA.orphan || [],
        'promos and singles TCGdex has no set checklist for'),
    ].filter(Boolean);
    for (const e of extra) { out.append(e); shown++; }
  }
  if (!shown) out.innerHTML = '<div class="empty">Nothing matches that search.</div>';

  const all = visibleSets().map(tally)
    .reduce((a,b) => ({have:a.have+b.have, total:a.total+b.total}), {have:0,total:0});
  let line = 'Collection checklist \u2014 ' + all.have + ' of ' + all.total + ' held';
  if (showPrice && DATA.currency) {
    const m = visibleSets().map(money)
      .reduce((a,b) => ({held:a.held+b.held, need:a.need+b.need}), {held:0,need:0});
    line += '  \u00b7  ' + fmt(m.held) + ' held, ' + fmt(m.need) + ' to complete';
  }
  document.getElementById('eyebrow').textContent = line;
}

function setMode(m){
  mode = m;
  for (const [id, key] of [['m-num','num'],['m-mas','mas'],['m-bin','binder']]) {
    document.getElementById(id).setAttribute('aria-pressed', String(m === key));
  }
  render();
}
document.getElementById('m-num').onclick = () => setMode('num');
document.getElementById('m-mas').onclick = () => setMode('mas');
document.getElementById('m-bin').onclick = () => setMode('binder');
document.getElementById('only').onchange = e => { onlyMissing = e.target.checked; render(); };
document.getElementById('art').onchange = e => { showArt = e.target.checked; render(); };
if (DATA.sets.some(s => String(s.tcgdex).startsWith('ja/'))) {
  document.getElementById('jp').onchange = e => { showJP = e.target.checked; render(); };
} else {
  document.getElementById('jp-wrap').remove();
}
if (DATA.currency) {
  document.getElementById('price').onchange = e => { showPrice = e.target.checked; render(); };
} else {
  document.getElementById('price-wrap').remove();
}
let timer;
document.getElementById('q').oninput = e => {
  clearTimeout(timer);
  timer = setTimeout(() => { query = e.target.value.trim().toLowerCase(); render(); }, 160);
};
if (START_SPLIT && DATA.variantData) setMode('mas'); else if (DATA.currency) {
  document.getElementById('price-note').textContent =
    'Card prices are Cardmarket trend values in EUR, converted to ' + DATA.currency +
    ' at the ECB rate of ' + DATA.fxDate + '. Sealed product and cards with no ' +
    'checklist use CollectR\u2019s own valuation instead, since TCGdex holds no ' +
    'sealed data. Indicative only, and fixed when this page was built (' +
    DATA.built + ').';
}
render();
</script>
