<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<meta name="theme-color" content="#111420">
<meta name="description" content="__DESC__">
<meta property="og:type" content="website">
<meta property="og:title" content="__TITLE__">
<meta property="og:description" content="__DESC__">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111420; --slab:#171b29; --pocket:#1d2231; --edge:#2b3247;
  --paper:#e9eaf2; --mute:#79809a; --dim:#4b5370;
  --foil-a:#67e8f9; --foil-b:#a78bfa; --foil-c:#fcd34d;
  --pad:clamp(16px,4vw,40px);
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ink); color:var(--paper);
  font:400 15px/1.5 Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px;margin:0 auto;padding:var(--pad)}

/* ---- header ---- */
header{padding-bottom:28px;border-bottom:1px solid var(--edge);margin-bottom:28px}
.eyebrow{
  font:700 11px/1 "JetBrains Mono",monospace;letter-spacing:.22em;
  text-transform:uppercase;color:var(--mute);margin-bottom:14px;
}
h1{
  font-family:"Bricolage Grotesque",sans-serif;font-weight:800;
  font-size:clamp(34px,7vw,60px);line-height:.95;letter-spacing:-.03em;margin:0 0 6px;
}
h1 em{
  font-style:normal;
  background:linear-gradient(100deg,var(--foil-a),var(--foil-b) 45%,var(--foil-c));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{color:var(--mute);font-size:14px;margin:0}

.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}
.seg{display:flex;background:var(--slab);border:1px solid var(--edge);border-radius:9px;padding:3px}
.seg button{
  appearance:none;border:0;background:none;color:var(--mute);cursor:pointer;
  font:600 12px/1 Inter,sans-serif;padding:8px 13px;border-radius:6px;
}
.seg button[aria-pressed=true]{background:var(--edge);color:var(--paper)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
input[type=search]{
  flex:1;min-width:170px;background:var(--slab);border:1px solid var(--edge);
  color:var(--paper);border-radius:9px;padding:10px 13px;font:400 14px Inter,sans-serif;
}
input[type=search]::placeholder{color:var(--dim)}
label.chk{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:13px;cursor:pointer;user-select:none}
input[type=checkbox]{accent-color:var(--foil-b);width:15px;height:15px}
:is(button,input,summary):focus-visible{outline:2px solid var(--foil-a);outline-offset:2px}

/* ---- set rows ---- */
details.set{border-bottom:1px solid var(--edge)}
details.set > summary{
  list-style:none;cursor:pointer;display:grid;gap:4px 16px;padding:18px 4px;
  grid-template-columns:1fr auto;align-items:center;
}
summary::-webkit-details-marker{display:none}
.set-name{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:19px;letter-spacing:-.01em}
.set-meta{font:400 12px "JetBrains Mono",monospace;color:var(--dim)}
.tally{font:700 14px "JetBrains Mono",monospace;text-align:right;white-space:nowrap}
.tally small{display:block;font-weight:400;font-size:11px;color:var(--dim);margin-top:3px}
.bar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--pocket);overflow:hidden}
.bar i{
  display:block;height:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--foil-a),var(--foil-b) 55%,var(--foil-c));
  transition:width .5s cubic-bezier(.2,.8,.2,1);
}
details.set[open] > summary .set-name{color:#fff}

/* ---- pockets ---- */
.page{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));
  gap:10px;padding:6px 0 30px;
  content-visibility:auto;contain-intrinsic-size:auto 600px;
}
.pocket{
  position:relative;aspect-ratio:63/88;border-radius:7px;background:var(--pocket);
  border:1px solid var(--edge);overflow:hidden;display:flex;flex-direction:column;
  justify-content:flex-end;padding:7px;
}
.pocket img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .4s;
}
.pocket.have img.on{opacity:1}
.pocket.have{background:#232a3d}
/* Held has to read as held even when no art loads. */
.pocket.have::before{
  content:'';position:absolute;top:6px;right:6px;z-index:3;width:9px;height:9px;
  border-radius:50%;background:var(--foil-a);
  box-shadow:0 0 0 2px rgba(10,12,20,.65);
}
.pocket.have.art::before{opacity:.9}
.pocket.miss img.on{opacity:.17;filter:grayscale(.85) contrast(.85)}
.pocket.miss{border-style:dashed;border-color:#333a52}
.cap{
  position:relative;z-index:2;font:400 10px/1.25 Inter,sans-serif;color:var(--mute);
  word-break:break-word;
  background:linear-gradient(transparent,rgba(10,12,20,.92) 42%);
  margin:-7px;padding:22px 7px 7px;
}
.pocket.have .cap{color:var(--paper)}
.num{font:700 10px "JetBrains Mono",monospace;color:var(--dim);display:block}
.pocket.have .num{color:var(--foil-a)}
/* ---- paired base / reverse ---- */
/* Strict numerical order: no dense packing, or a later single backfills an
   earlier gap and the numbers stop reading in sequence. An even column count
   keeps pairs from straddling row ends. */
.page.paired{
  grid-auto-flow:row;
  grid-template-columns:repeat(8,1fr);
}
@media (max-width:980px){.page.paired{grid-template-columns:repeat(6,1fr)}}
@media (max-width:720px){.page.paired{grid-template-columns:repeat(4,1fr)}}
@media (max-width:460px){.page.paired{grid-template-columns:repeat(2,1fr)}}
.pair{display:grid;grid-column:span 2;grid-template-columns:1fr 1fr;gap:6px}
@media (max-width:420px){
  .pair{grid-column:span 2}
}
/* Reverse holos reuse the base art, so a foil sheen is what tells them apart. */
.pocket.rev::after{
  content:'';position:absolute;inset:0;z-index:1;pointer-events:none;
  background:
    repeating-linear-gradient(112deg,
      rgba(255,255,255,.13) 0 2px, rgba(255,255,255,0) 2px 6px),
    linear-gradient(112deg,
      rgba(103,232,249,.62) 0%, rgba(167,139,250,.16) 20%,
      rgba(252,211,77,.55) 38%, rgba(103,232,249,.14) 56%,
      rgba(244,114,182,.55) 74%, rgba(167,139,250,.26) 100%);
  mix-blend-mode:overlay;opacity:.9;
  transition:filter .45s ease, opacity .45s ease;
}
.pocket.rev.miss::after{opacity:.32}
.pocket.rev:hover::after{filter:hue-rotate(50deg) saturate(1.3)}
.rev-tag{
  position:absolute;top:6px;left:6px;z-index:3;
  font:700 8px "JetBrains Mono",monospace;letter-spacing:.1em;color:#0d1018;
  background:linear-gradient(100deg,var(--foil-a),var(--foil-b) 60%,var(--foil-c));
  border-radius:4px;padding:2px 5px;
}

/* ---- sealed / untracked inventory ---- */
.shelf{padding:6px 0 26px;display:flex;flex-direction:column;gap:2px}
.item{
  display:flex;align-items:center;gap:12px;padding:11px 8px;
  border-bottom:1px solid #1e2434;
}
.item:last-child{border-bottom:0}
.item-logo{width:46px;height:26px;object-fit:contain;flex:none;opacity:.85}
.item-logo.blank{background:var(--pocket);border-radius:4px}
.item-main{flex:1;min-width:0}
.item-name{font-size:13px;color:var(--paper)}
.item-set{font:400 11px "JetBrains Mono",monospace;color:var(--dim);margin-top:2px}
.item-qty{
  font:700 11px "JetBrains Mono",monospace;color:var(--foil-c);flex:none;
}
details.set.inv > summary .set-name{color:var(--foil-c)}

/* ---- variant tracks ---- */
.track{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 18px;padding:14px 2px 10px;
}
.track-name{
  font:600 12px/1 Inter,sans-serif;letter-spacing:.02em;color:var(--paper);
}
.track-name.rev{color:var(--foil-b)}
.track-count{font:400 11px "JetBrains Mono",monospace;color:var(--dim)}
.track-bar{flex:1;height:3px;border-radius:2px;background:var(--pocket);overflow:hidden;min-width:40px}
.track-bar i{display:block;height:100%;background:currentColor;opacity:.8}
.rev-tint{border-color:#3a2f55}
.note{
  padding:0 2px 8px;font:400 11px Inter,sans-serif;color:var(--dim);
}
.note b{color:var(--foil-b);font-weight:600}
.offline{
  border:1px solid #4a3a2a;background:#241d16;border-radius:10px;
  padding:12px 14px;margin-bottom:22px;font-size:13px;color:#e2c9a4;
}
.strays{padding:0 0 26px;font-size:13px;color:var(--mute)}
.strays code{font-family:"JetBrains Mono",monospace;color:var(--foil-a)}
.empty{padding:26px 4px;color:var(--dim);font-size:14px}
footer{margin-top:36px;padding-top:20px;border-top:1px solid var(--edge);color:var(--dim);font-size:12px}
footer a{color:var(--mute)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow" id="eyebrow">Collection checklist</p>
    <h1>What's <em>missing</em></h1>
    <p class="sub" id="sub"></p>
    <div class="controls">
      <div class="seg" role="group" aria-label="Completion mode">
        <button id="m-num" aria-pressed="true">By number</button>
        <button id="m-mas" aria-pressed="false">Split by finish</button>
      </div>
      <input type="search" id="q" placeholder="Find a card or set">
      <label class="chk"><input type="checkbox" id="only"> Missing only</label>
      <label class="chk"><input type="checkbox" id="art" checked> Card art</label>
    </div>
  </header>
  <main id="out"></main>
  <footer>
    Checklists from <a href="https://tcgdex.dev">TCGdex</a>. Card images load from
    their CDN, so this page needs a connection to show them.
  </footer>
</div>

<script>
const DATA = /*__DATA__*/null;
const out = document.getElementById('out');
let mode = 'num', onlyMissing = false, query = '', showArt = true;
const opened = new Set();   // sets the reader has expanded, kept across redraws
const START_SPLIT = true;   // open on the paired base/reverse view

// A "track" is one parallel checklist through a set. Base print folds normal
// and holo together (a set is one list of numbers, some of which print holo);
// reverse holo is its own run of the same numbers.
const TRACKS = [
  {key:'base', name:'Base print',  cls:'',    vars:['normal','holo']},
  {key:'rev',  name:'Reverse holo',cls:'rev', vars:['reverse']},
  {key:'fe',   name:'1st Edition', cls:'',    vars:['firstEdition']},
];

// Cards with no variant data at all still belong somewhere: put them in the
// base print track so they never silently disappear from split mode.
const bare = c => !c.vars.length;
const inTrack = (c,t) =>
  t.vars.some(v => c.vars.includes(v)) || (t.key === 'base' && bare(c));
const heldIn = (c,t) =>
  t.vars.some(v => c.has[v] > 0) || (t.key === 'base' && bare(c) && c.qty > 0);

function tracksFor(set){
  return TRACKS
    .map(t => ({...t, cards:set.cards.filter(c => inTrack(c,t))}))
    .filter(t => t.cards.length);
}

if (!DATA.variantData) {
  const b = document.getElementById('m-mas');
  b.disabled = true;
  b.title = 'Rebuild without --no-variants to enable master-set mode';
}
document.getElementById('sub').textContent = DATA.owner
  ? DATA.owner + " \u2014 " + DATA.sets.length + " sets tracked"
  : DATA.sets.length + " sets tracked";

function tally(set){
  let have = 0, total = 0;
  if (mode === 'num') {
    for (const c of set.cards) { total++; if (c.qty > 0) have++; }
  } else {
    for (const t of tracksFor(set))
      for (const c of t.cards) { total++; if (heldIn(c,t)) have++; }
    if (!total) for (const c of set.cards) { total++; if (c.qty > 0) have++; }
  }
  return {have, total, pct: total ? have/total : 0};
}

function matches(c){
  if (!query) return true;
  return (c.name||'').toLowerCase().includes(query) || String(c.n).includes(query);
}

function pocket(c, held, reverse){
  const el = document.createElement('div');
  el.className = 'pocket ' + (held ? 'have' : 'miss') + (reverse ? ' rev' : '');
  if (c.img && showArt) {
    const img = new Image();
    img.loading = 'lazy'; img.decoding = 'async'; img.alt = '';
    img.referrerPolicy = 'no-referrer';
    img.src = c.img + '/low.webp';
    img.onload  = () => { img.classList.add('on'); el.classList.add('art'); };
    img.onerror = () => noteOffline();
    el.append(img);
  }
  if (reverse) {
    const tag = document.createElement('span');
    tag.className = 'rev-tag'; tag.textContent = 'REV';
    el.append(tag);
  }
  const cap = document.createElement('div');
  cap.className = 'cap';
  cap.innerHTML = '<span class="num"></span>';
  cap.firstChild.textContent = c.n;
  cap.append(document.createTextNode(c.name || ''));
  el.append(cap);
  return el;
}

// Flat grid: one pocket per card, used for the plain by-number view.
function grid(cards, heldFn){
  const page = document.createElement('div');
  page.className = 'page';
  let n = 0;
  for (const c of cards) {
    if (!matches(c)) continue;
    const held = heldFn(c);
    if (onlyMissing && held) continue;
    page.append(pocket(c, held, false)); n++;
  }
  return n ? page : null;
}

// Paired grid: base print on the left, its reverse holo directly beside it.
function pairedGrid(set, base, rev){
  const page = document.createElement('div');
  page.className = 'page paired';
  let n = 0;
  for (const c of set.cards) {
    if (!matches(c)) continue;
    const inB = inTrack(c, base), inR = inTrack(c, rev);
    if (!inB && !inR) continue;
    const hB = inB && heldIn(c, base), hR = inR && heldIn(c, rev);

    // On a want-list, show only what's actually missing: if the base print is
    // already held, the reverse alone is the ask.
    if (onlyMissing) {
      const needB = inB && !hB, needR = inR && !hR;
      if (!needB && !needR) continue;
      if (needB && needR) {
        const pair = document.createElement('div');
        pair.className = 'pair';
        pair.append(pocket(c, false, false), pocket(c, false, true));
        page.append(pair);
      } else {
        page.append(pocket(c, false, needR));
      }
      n++;
      continue;
    }

    if (inB && inR) {
      const pair = document.createElement('div');
      pair.className = 'pair';
      pair.append(pocket(c, hB, false));
      pair.append(pocket(c, hR, true));
      page.append(pair);
    } else {
      // ex cards and secrets have no reverse printing - single slot, no gap.
      page.append(pocket(c, inB ? hB : hR, !inB));
    }
    n++;
  }
  return n ? page : null;
}

// One inline progress chip per finish track, shown above the paired grid.
function band(t){
  const have = t.cards.filter(c => heldIn(c,t)).length;
  const d = document.createElement('span');
  d.style.cssText = 'display:flex;align-items:baseline;gap:8px;min-width:190px;flex:1';
  d.innerHTML =
    '<span class="track-name ' + t.cls + '"></span>' +
    '<span class="track-count">' + have + ' / ' + t.cards.length + '</span>' +
    '<span class="track-bar" style="color:' +
      (t.cls === 'rev' ? 'var(--foil-b)' : 'var(--foil-a)') + '">' +
      '<i style="width:' + (have/t.cards.length*100).toFixed(1) + '%"></i></span>';
  d.querySelector('.track-name').textContent = t.name;
  return d;
}

// Building every set's pockets up front is ~4,300 nodes and janks on phones.
// Summaries render immediately; a set's grid is built the first time it opens.
function buildBody(d, set){
  let drew = 0;
  if (mode === 'mas') {
    const tracks = tracksFor(set);
    const base = tracks.find(t => t.key === 'base');
    const rev  = tracks.find(t => t.key === 'rev');
    const row = document.createElement('div');
    row.className = 'track';
    for (const tr of tracks) row.append(band(tr));
    const g = rev && base ? pairedGrid(set, base, rev) : grid(set.cards, c => c.qty > 0);
    if (g) {
      d.append(row);
      if (set.revInferred) {
        const n = document.createElement('div');
        n.className = 'note';
        n.innerHTML = '<b>Reverse run reconstructed.</b> TCGdex has no reverse ' +
          'holo data for this set yet, so it is inferred from rarity: every ' +
          'Common, Uncommon and Rare inside the numbered run.';
        d.append(n);
      }
      d.append(g);
      drew++;
    }
  } else {
    const g = grid(set.cards, c => c.qty > 0);
    if (g) { d.append(g); drew++; }
  }
  if (!drew) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = onlyMissing ? 'Complete \u2014 nothing missing here.' : 'No cards match.';
    d.append(e);
  }
  if (set.strays.length) {
    const st = document.createElement('div');
    st.className = 'strays';
    st.append(document.createTextNode('Not on this checklist: '));
    set.strays.forEach((x,i) => {
      if (i) st.append(document.createTextNode(', '));
      const code = document.createElement('code');
      code.textContent = x.n;
      st.append(code, document.createTextNode(' ' + x.name));
    });
    d.append(st);
  }
}

// If the art can't be reached, say so once rather than leaving blank pockets.
let offlineShown = false, failures = 0;
function noteOffline(){
  if (offlineShown || ++failures < 4) return;
  offlineShown = true;
  const b = document.createElement('div');
  b.className = 'offline';
  b.textContent = "Card art couldn't load \u2014 you're offline, or the image host " +
    "is unreachable. Everything else works: cards you own have a dot in the corner, " +
    "missing ones don't.";
  out.parentNode.insertBefore(b, out);
}

// Sealed product and cards from sets with no checklist: inventory, not a
// checklist, so they get a plain list and sit out of the completion maths.
function shelf(items){
  const el = document.createElement('div');
  el.className = 'shelf';
  let n = 0;
  for (const it of items) {
    if (query && !(it.name + ' ' + it.set).toLowerCase().includes(query)) continue;
    const row = document.createElement('div');
    row.className = 'item';
    if (it.logo && showArt) {
      const img = new Image();
      img.className = 'item-logo'; img.loading = 'lazy'; img.alt = '';
      img.referrerPolicy = 'no-referrer'; img.src = it.logo + '.png';
      row.append(img);
    } else {
      const b = document.createElement('span');
      b.className = 'item-logo blank';
      row.append(b);
    }
    const main = document.createElement('div');
    main.className = 'item-main';
    const nm = document.createElement('div');
    nm.className = 'item-name'; nm.textContent = it.name;
    const st = document.createElement('div');
    st.className = 'item-set';
    st.textContent = it.set + (it.n ? '  \u00b7  ' + it.n : '') +
                     (it.finish ? '  \u00b7  ' + it.finish : '');
    main.append(nm, st);
    row.append(main);
    if (it.qty > 1) {
      const q = document.createElement('span');
      q.className = 'item-qty'; q.textContent = '\u00d7' + it.qty;
      row.append(q);
    }
    el.append(row); n++;
  }
  return n ? el : null;
}

function inventorySection(label, items, note){
  const body = shelf(items);
  if (!body) return null;
  const count = items.reduce((t,i) => t + i.qty, 0);
  const d = document.createElement('details');
  d.className = 'set inv';
  d.innerHTML =
    '<summary><div><div class="set-name"></div><div class="set-meta"></div></div>' +
    '<div class="tally">' + count + '<small>item' + (count === 1 ? '' : 's') +
    '</small></div></summary>';
  d.querySelector('.set-name').textContent = label;
  d.querySelector('.set-meta').textContent = note;
  d.addEventListener('toggle', () => {
    if (d.open) { opened.add(label); if (!d.dataset.built) { d.dataset.built='1'; d.append(shelf(items)); } }
    else opened.delete(label);
  });
  if (query || opened.has(label)) { d.open = true; d.dataset.built='1'; d.append(body); }
  return d;
}

function render(){
  out.textContent = '';
  let shown = 0;
  for (const set of DATA.sets) {
    const hit = set.label.toLowerCase().includes(query);
    if (query && !hit && !set.cards.some(matches)) continue;
    shown++;
    const t = tally(set);

    const d = document.createElement('details');
    d.className = 'set';
    d.innerHTML =
      '<summary><div><div class="set-name"></div><div class="set-meta"></div></div>' +
      '<div class="tally">' + t.have + ' / ' + t.total +
      '<small>' + Math.round(t.pct*100) + '% complete</small></div>' +
      '<div class="bar"><i style="width:' + (t.pct*100).toFixed(1) + '%"></i></div></summary>';
    d.querySelector('.set-name').textContent = set.label;
    d.querySelector('.set-meta').textContent =
      set.tcgdex + (set.released ? '  \u00b7  ' + set.released : '');

    d.addEventListener('toggle', () => {
      if (d.open) {
        opened.add(set.label);
        if (!d.dataset.built) { d.dataset.built = '1'; buildBody(d, set); }
      } else {
        opened.delete(set.label);
      }
    });
    // Restore-on-redraw builds directly: the toggle event is async, so relying
    // on it here leaves a re-opened set empty.
    if (query || opened.has(set.label)) {
      d.open = true;
      d.dataset.built = '1';
      buildBody(d, set);
    }
    out.append(d);
  }
  // Nothing here can be missing, so keep it out of the want-list view.
  if (!onlyMissing) {
    const extra = [
      inventorySection('Sealed', DATA.sealed || [],
        'boxes, ETBs and collections \u2014 no checklist to complete'),
      inventorySection('Outside a tracked set', DATA.orphan || [],
        'promos and singles TCGdex has no set checklist for'),
    ].filter(Boolean);
    for (const e of extra) { out.append(e); shown++; }
  }
  if (!shown) out.innerHTML = '<div class="empty">Nothing matches that search.</div>';

  const all = DATA.sets.map(tally)
    .reduce((a,b) => ({have:a.have+b.have, total:a.total+b.total}), {have:0,total:0});
  document.getElementById('eyebrow').textContent =
    'Collection checklist \u2014 ' + all.have + ' of ' + all.total + ' held';
}

function setMode(m){
  mode = m;
  document.getElementById('m-num').setAttribute('aria-pressed', m === 'num');
  document.getElementById('m-mas').setAttribute('aria-pressed', m === 'mas');
  render();
}
document.getElementById('m-num').onclick = () => setMode('num');
document.getElementById('m-mas').onclick = () => setMode('mas');
document.getElementById('only').onchange = e => { onlyMissing = e.target.checked; render(); };
document.getElementById('art').onchange = e => { showArt = e.target.checked; render(); };
let timer;
document.getElementById('q').oninput = e => {
  clearTimeout(timer);
  timer = setTimeout(() => { query = e.target.value.trim().toLowerCase(); render(); }, 160);
};
if (START_SPLIT && DATA.variantData) setMode('mas'); else render();
</script>
</body>
</html>
